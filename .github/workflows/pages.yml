name: Deploy landing page
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/build-site.mjs"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_run:
    workflows: ["Release desktop installers"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Read published release downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/empios/LlamaPilot/releases/latest > "$RUNNER_TEMP/landing-release.json"
      - name: Build static landing page
        run: node scripts/build-site.mjs "$RUNNER_TEMP/landing-release.json"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
