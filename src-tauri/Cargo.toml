[package]
name = "llamapilot"
version = "0.4.1"
description = "Control panel and runtime manager for llama.cpp"
authors = ["LlamaPilot contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.82"

[lib]
name = "llamapilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs"] }
thiserror = "2.0.20"
tracing = "0.1.44"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.20.0", features = ["v4", "serde"] }
sysinfo = "0.36.1"
which = "8.0.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
notify = "8.2.0"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
